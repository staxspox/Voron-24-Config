#####################################################################
[gcode_macro PRINT_START]
#####################################################################
#YOU MUST ADD THES LINES TO super SLICER PRINT START COED IN THE PRTER SETTINGS SECTION OR NOT OF THIS WLL WORK - EACH LINE MUST BE UNCOMMENTED
#M104 S0 ; Stops OrcaSlicer from sending temp waits separately
#M140 S0
#PRINT_START BED=[first_layer_bed_temperature] MATERIAL=[filament_type[initial_extruder]] EXTRUDER=[first_layer_temperature] CHAMBER=[chamber_temperature]
#SKEW_PROFILE LOAD=my_skew_profile
#optional PA=[pressure_advance[]] NOZZLE=[nozzle_diameter] TOOL=[initial_extruder] SIZE={first_layer_print_min[0]}_{first_layer_print_min[1]}_{first_layer_print_max[0]}_{first_layer_print_max[1]}
# 🧹⤵️😮‍💨🏎️🌡️🏠⏩⏪❄️💡⏱️🚮⏲️⚖️🥓𓈉⏬📶☰ᚙ🛑⚠️🏁🔥
gcode:
  # This part fetches data from your slicer
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default(0)|int %}
  {% set material = params.MATERIAL|default("UNKNOWN")|upper %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
 
  # Sprawdź czy czujnik komory istnieje
  {% set chamber_exists = printer["temperature_sensor chamber"] is defined %}
  {% set current_chamber = printer["temperature_sensor chamber"].temperature|float(0) if chamber_exists else 0 %}
 
  # Lista materiałów wysokotemperaturowych
  {% set high_temp_materials = ["ABS", "ABS_CF", "ASA", "ASA_CF", "PC", "PC_CF", "PC+CF", "PC+ABS", "PC+ABS_CF", "POLYCARBONATE", "NYLON", "NYLON12", "NYLON_CF", "PA6", "PA6_CF", "PA", "PA12", "PEEK", "PEEK_CF", "PEI", "PEI_CF", "PPS", "PPS_CF", "PPA", "PVDF"] %}
 
  M117 PRINT START: {material} at {target_bed}°C
  # LED and status
  LED_ON
  PREFLIGHT_CHECK
  SET_DISPLAY_TEXT MSG="Preheating..."
  STATUS_HEATING
  M117 Preheating...
 
## Uncomment for bed mesh (1 of 2 for bed mesh) # Clear old saved bed mesh (if any)
  BED_MESH_CLEAR

## Uncomment for Beacon Contact (1 of 4 for beacon contact)
  SET_GCODE_OFFSET Z=0 # Set offset to 0
 
  # ============================================
  # 🟢 NAJPIERW HOME'OWANIE 🟢
  # ============================================
  STATUS_HOMING
  G28 # Pełne home'owanie wszystkich osi
 
  # ============================================
  # 🟢 TERAZ MOŻNA PARKOWAĆ 🟢
  # ============================================
  SET_DISPLAY_TEXT MSG="Parking nozzle..."
  PARK_NOZZLE
 
  # ============================================
  # CHAMBER HEATSOAK (jeśli potrzebny) - po parkowaniu dyszy
  # ============================================
  {% set needs_soak = false %}
  {% if chamber_exists and (target_chamber > 0 or material in high_temp_materials) and target_bed >= 90 %}
    {% set needs_soak = true %}
  {% endif %}
 
  {% if needs_soak %}
    SET_DISPLAY_TEXT MSG="Chamber heatsoak..."
    M117 Starting chamber heatsoak for {material}
   
    # Uruchom dynamiczny heatsoak (dysza jest już zaparkowana)
    CHAMBER_HEATSOAK BED_TEMP={target_bed} MATERIAL={material} CHAMBER_TEMP={target_chamber}
   
    # Po zakończeniu soak, kontynuujemy
    SET_DISPLAY_TEXT MSG="Soak complete, continuing..."
    M117 Soak complete, continuing...
  {% else %}
    # ============================================
    # TRADYCYJNE GRZANIE (bez soak)
    # ============================================
    SET_DISPLAY_TEXT MSG="Heating bed to {target_bed}°C"
    M117 Heating bed to {target_bed}°C
   
    # Grzej łóżko - to aktywuje Twoje bedfans
    M190 S{target_bed}
   
    # Sprawdź czy potrzebujemy statycznego soak
    {% if target_bed > 60 and material not in high_temp_materials %}
      {% set soak_seconds = [0, (target_bed - 60) * 10]|max %}
      {% set soak_seconds = [soak_seconds, 300]|min %}
     
      {% if soak_seconds > 0 and current_chamber <= 50 %}
        {% set soak_min = soak_seconds // 60 %}
        {% set soak_sec = soak_seconds % 60 %}
        {% set soak_time_msg = "{0}min {1}sek".format(soak_min, soak_sec) %}
       
        SET_DISPLAY_TEXT MSG="Static soak: {soak_time_msg}"
        M117 Static soak: {soak_time_msg}
        G4 P{soak_seconds * 1000}
      {% else %}
        SET_DISPLAY_TEXT MSG="No soak needed"
        M117 No soak
      {% endif %}
    {% endif %}
   
    # Czekaj na temperaturę komory jeśli wymagana
    {% if target_chamber > 0 and chamber_exists and target_chamber > (current_chamber + 3) %}
      SET_DISPLAY_TEXT MSG="Waiting for chamber {target_chamber}°C"
      M117 Waiting for chamber {target_chamber}°C
      TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}
    {% endif %}
  {% endif %}
 
    M104 S150 # Ustaw wstępną temperaturę hotendu na 150°C
    M109 S150 # CZEKAJ aż osiągnie 150°C
    SET_DISPLAY_TEXT MSG="Nozzle Wipe" # Display info on display
    NOZZLE_WIPE

## Uncomment for Beacon contact (2 of 4 for beacon contact)
    G28 Z METHOD=CONTACT CALIBRATE=1 # Calibrate z offset and beacon model

## Uncomment for V2.4 (Quad Gantry Level AKA QGL)
    SET_DISPLAY_TEXT MSG="Leveling" # Display info on display
    STATUS_LEVELING # Set LEDs to leveling-mode
    QUAD_GANTRY_LEVEL # Level the printer via QGL
    G28 Z METHOD=PROXIMITY
    M400

## Uncomment for bed mesh (2 of 2 for bed mesh)
    SET_DISPLAY_TEXT MSG="Bed mesh" # Display info on display
    STATUS_MESHING # Set LEDs to bed mesh-mode
    BED_MESH_CALIBRATE ADAPTIVE=1 RUNS=2 # Start the bed mesh in scan mode (add ADAPTIVE=1) for adaptive bed mesh
    M400

## Uncomment for Beacon Contact (3 of 4 for beacon contact)
    G28 Z METHOD=CONTACT CALIBRATE=0 # Home Z again after cleaning #CALIBRATE=1
    M400

## Heat up the hotend up to target via data from slicer
    SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c" # Display info on display
    SMART_PARK
    #G1 X{x_wait} Y{y_wait} Z15 F9000 # Go to center of the bed
    STATUS_HEATING # Set LEDs to heating-mode
    M107 # Turn off partcooling fan
    M109 S{target_extruder} # Heat the hotend to set temp
       
## Uncomment for Beacon Contact (4 of 4 for beacon contact)
    #CONFIGURE_FILAMENT_OFFSET FILAMENT_TYPE={FILAMENT_TYPE} # We set our offset based on filament type and a thermal expansion
    #SET_GCODE_OFFSET Z=0.065 # add a little offset for hotend thermal expansion
                                                             # needs fine tuning, long meltzones require more
    _SET_MPC_MATERIAL MATERIAL={params.MATERIAL} # Set heater MPC parameters for a given material
   
## ✅ KOMPENSACJA TERMICZNA HOTENDU
   {% if printer.configfile.settings.beacon is defined %}
    _BEACON_SET_NOZZLE_TEMP_OFFSET # ✅ Automatyczny offset z rozszerzalności termicznej hotendu
   {% endif %}

## HOT NOZZLE FINAL CALIBRATION - Before Print!
    #SET_DISPLAY_TEXT MSG="Final Z-offset calibration"
    #G4 P60000 # Pauza 60 sekund (opcjonalnie)
    #NOZZLE_WIPE # Nozzle Cleaning
    #G28 Z METHOD=CONTACT CALIBRATE=0 # ✅ OSTATECZNY zapis offsetu na docelowej temp! #CALIBRATE=0
    #M400

## Get ready to print by doing a primeline and updating the LEDs
    SET_DISPLAY_TEXT MSG="Printer goes brr..." # Display info on display
    STATUS_PRINTING # Set LEDs to printing-mode

## PURGE LINE
    LINE_PURGE # Adaptive Purge Line
    #PRIME_LINE
    #ZIGZAG
    #SQUIGGLY_PURGE # Wave Line
    #
    G90 # Absolute position