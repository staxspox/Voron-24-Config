[gcode_macro RAMP_BED_TEMP]
description: Inteligentna rampa stołu 70→150°C z dłuższymi soakami (650W)
gcode:
    {% set TARGET = params.TARGET|default(110)|int %}
    {% set current = printer.heater_bed.temperature | float | round(0) | int %}

    RESPOND MSG="=== RAMP_BED_TEMP START → Cel: {TARGET}°C ==="
    RESPOND MSG="Aktualna temperatura stołu: {current}°C"

    # ==================== Rampa z soakami ====================

    {% if current < 70 and TARGET >= 70 %}
        SET_HEATER_TEMPERATURE heater=heater_bed target=70
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=70
        G4 P10000
        RESPOND MSG="→ 70°C | soak 10s"
    {% endif %}

    {% if current < 85 and TARGET >= 85 %}
        SET_HEATER_TEMPERATURE heater=heater_bed target=85
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=85
        G4 P12000
        RESPOND MSG="→ 85°C | soak 12s"
    {% endif %}

    {% if current < 95 and TARGET >= 95 %}
        SET_HEATER_TEMPERATURE heater=heater_bed target=95
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=95
        G4 P12000
        RESPOND MSG="→ 95°C | soak 12s"
    {% endif %}

    {% if current < 100 and TARGET >= 100 %}
        SET_HEATER_TEMPERATURE heater=heater_bed target=100
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=100
        G4 P15000
        RESPOND MSG="→ 100°C | soak 15s"
    {% endif %}

    {% if current < 110 and TARGET >= 110 %}
        SET_HEATER_TEMPERATURE heater=heater_bed target=110
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=110
        G4 P20000
        RESPOND MSG="→ 110°C | soak 20s"
    {% endif %}

    {% if current < 120 and TARGET >= 120 %}
        SET_HEATER_TEMPERATURE heater=heater_bed target=120
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=120
        G4 P30000
        RESPOND MSG="→ 120°C | soak 30s"
    {% endif %}

    {% if current < 130 and TARGET >= 130 %}
        SET_HEATER_TEMPERATURE heater=heater_bed target=130
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=130
        G4 P40000
        RESPOND MSG="→ 130°C | soak 40s"
    {% endif %}

    {% if current < 140 and TARGET >= 140 %}
        SET_HEATER_TEMPERATURE heater=heater_bed target=140
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=140
        G4 P50000
        RESPOND MSG="→ 140°C | soak 50s"
    {% endif %}

    {% if current < 150 and TARGET >= 150 %}
        SET_HEATER_TEMPERATURE heater=heater_bed target=150
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=150
        G4 P60000
        RESPOND MSG="→ 150°C | soak 60s"
    {% endif %}

    # ==================== Finalny soak ====================
    RESPOND MSG="=== FINALNY SOAK na {TARGET}°C ==="

    {% if TARGET >= 140 %}
        G4 P120000                    ; 2 minuty przy 140°C i wyżej
        RESPOND MSG="FINALNY SOAK 120s (2 minuty) zakończony – stół gotowy!"
    {% elif TARGET >= 120 %}
        G4 P90000                     ; 1,5 minuty przy 120–135°C
        RESPOND MSG="FINALNY SOAK 90s zakończony – stół gotowy!"
    {% else %}
        G4 P60000                     ; 1 minuta przy niższych temperaturach
        RESPOND MSG="FINALNY SOAK 60s zakończony – stół gotowy!"
    {% endif %}

    RESPOND MSG="=== RAMP_BED_TEMP KONIEC ==="