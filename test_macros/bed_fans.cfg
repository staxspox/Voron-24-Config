#####################################################################
#	Monolith Bed Fans - POPRAWIONA (50% podczas grzania, 100% po osiągnięciu)
#####################################################################

[gcode_macro _BEDFANVARS]
variable_threshold: 99  # If bed temp target is above this threshold, fans will be enabled
variable_fast: 1.0      # Fan speed once bed temp is reached (100%)
variable_slow: 0.5      # Fan speed while bed is heating (50%)
gcode:

########## Bed Fans #########
[fan_generic Monolith_Bed_Fan_Middle]
pin: PD14
kick_start_time: 0.1

[fan_generic Monolith_Bed_Fan_Outside]
pin: PD15
kick_start_time: 0.1

########## Aliases #########
[gcode_macro BEDFANSSLOW]
gcode:
  {% set SLOW = printer["gcode_macro _BEDFANVARS"].slow|float %}
  SET_FAN_SPEED FAN=Monolith_Bed_Fan_Middle SPEED={SLOW}
  SET_FAN_SPEED FAN=Monolith_Bed_Fan_Outside SPEED={SLOW}
  { action_respond_info("Bed fans SLOW (%d%%)" % (SLOW*100)) }

[gcode_macro BEDFANSFAST]
gcode:
  {% set FAST = printer["gcode_macro _BEDFANVARS"].fast|float %}
  SET_FAN_SPEED FAN=Monolith_Bed_Fan_Middle SPEED={FAST}
  SET_FAN_SPEED FAN=Monolith_Bed_Fan_Outside SPEED={FAST}
  { action_respond_info("Bed fans FAST (%d%%)" % (FAST*100)) }

[gcode_macro BEDFANSOFF]
gcode:
  SET_FAN_SPEED FAN=Monolith_Bed_Fan_Middle SPEED=0
  SET_FAN_SPEED FAN=Monolith_Bed_Fan_Outside SPEED=0
  UPDATE_DELAYED_GCODE ID=bedfan_monitor DURATION=0
#  { action_respond_info("Bed fans OFF") }

############ Command overrides ############
# Override M140 (Set Bed Temperature)
[gcode_macro M140]
rename_existing: M99140
gcode:
  # Parameters
  {% set S = params.S|float %}
  {% set THRESHOLD = printer["gcode_macro _BEDFANVARS"].threshold|int %}
  
  # Wywołaj oryginalne M140
  M99140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
  
  # Zarządzaj wentylatorami
  {% if S >= THRESHOLD %}
    BEDFANSSLOW  # 🟢 WŁĄCZAMY NA 50% OD RAZU 🟢
    UPDATE_DELAYED_GCODE ID=bedfan_monitor DURATION=5
  {% else %}
    BEDFANSOFF
  {% endif %}

# Override M190 (Wait for Bed Temperature)
[gcode_macro M190]
rename_existing: M99190
gcode:
  # Parameters
  {% set S = params.S|int %}
  {% set THRESHOLD = printer["gcode_macro _BEDFANVARS"].threshold|int %}
  
  # Ustaw temperaturę (używa naszego M140)
  M140 S{S}
  
  # Czekaj na osiągnięcie temperatury
  {% if S != 0 %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={S|int} MAXIMUM={S|int + 5}
  {% endif %}
  
  # PO osiągnięciu temperatury - włącz na 100%
  {% if S >= THRESHOLD %}
    BEDFANSFAST  # 🟢 PRZESKOK NA 100% 🟢
  {% endif %}

# Override SET_HEATER_TEMPERATURE
[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: _SET_HEATER_TEMPERATURE
gcode:
  {% set HEATER = params.HEATER|default("None") %}
  {% set TARGET = params.TARGET|default(0)|int %}
  
  {% if HEATER|lower == "extruder" %}
    M104 S{TARGET}
  {% elif HEATER|lower == "heater_bed" %}
    M140 S{TARGET}
  {% else %}
    {action_respond_info("Heater %s not supported" % HEATER)}
  {% endif %}

# Override TURN_OFF_HEATERS
[gcode_macro TURN_OFF_HEATERS]
rename_existing: _TURN_OFF_HEATERS
gcode:
  BEDFANSOFF
  _TURN_OFF_HEATERS

################ Monitoring loop #####################
[delayed_gcode bedfan_monitor]
gcode:
  {% set THRESHOLD = printer["gcode_macro _BEDFANVARS"].threshold|int %}
  {% set FAST = printer["gcode_macro _BEDFANVARS"].fast|float %}
  {% set SLOW = printer["gcode_macro _BEDFANVARS"].slow|float %}
  
  # Sprawdź czy cel temperatury jest powyżej progu
  {% if printer.heater_bed.target >= THRESHOLD %}
    # Jeśli temperatura jest blisko celu (w granicach 3°C), ustaw FAST
    {% if printer.heater_bed.temperature >= (printer.heater_bed.target - 3) %}
      SET_FAN_SPEED FAN=Monolith_Bed_Fan_Middle SPEED={FAST}
      SET_FAN_SPEED FAN=Monolith_Bed_Fan_Outside SPEED={FAST}
    {% else %}
      # Jeśli temperatura spadła, włącz SLOW
      SET_FAN_SPEED FAN=Monolith_Bed_Fan_Middle SPEED={SLOW}
      SET_FAN_SPEED FAN=Monolith_Bed_Fan_Outside SPEED={SLOW}
    {% endif %}
    # Kontynuuj monitorowanie
    UPDATE_DELAYED_GCODE ID=bedfan_monitor DURATION=10
  {% else %}
    # Jeśli cel spadł poniżej progu, wyłącz wentylatory
    BEDFANSOFF
  {% endif %}