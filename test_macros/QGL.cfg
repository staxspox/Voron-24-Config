#####################################################################
#   QUAD GANTRY LEVEL
#####################################################################

[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420

points:
  30,5     #  50,25
  30,300   #  50,300
  320,300  #  300,300
  320,5    #  300,25

speed: 1000
horizontal_move_z: 5 #10
retries: 10 #5
retry_tolerance: 0.0075
max_adjust: 50
#adaptive_horizontal_move_z: true

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: BASE_QUAD_GANTRY_LEVEL
description: Smart QGL - coarse tylko po restarcie + zoptymalizowany fine
gcode:
    # === Sprawdzenie homingu ===
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_respond_info("QGL: Brak homingu XYZ – wykonuję G28") }
        G28 METHOD=PROXIMITY
    {% endif %}

    STATUS_LEVELING
    SET_DISPLAY_TEXT MSG="QGL - Leveling gantry"

    # === Pass 1: Coarse (tylko jeśli nie było jeszcze QGL po restarcie) ===
    {% if printer.quad_gantry_level.applied == False %}
        { action_respond_info("QGL: Pass 1 - Coarse leveling (pierwszy raz po restarcie)") }
        SET_DISPLAY_TEXT MSG="QGL Pass 1 - Coarse"

        BASE_QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=10 RETRY_TOLERANCE=0.05 RETRIES=10
    {% else %}
        { action_respond_info("QGL: Coarse pass pominięty – już zastosowany") }
    {% endif %}

    # === Pass 2: Fine (zawsze) ===
    { action_respond_info("QGL: Pass 2 - Fine leveling") }
    SET_DISPLAY_TEXT MSG="QGL Pass 2 - Fine"

    BASE_QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=2 RETRY_TOLERANCE=0.01 RETRIES=5

    # === Sprawdzenie wyniku ===
    CHECK_QGL

    # === Powrót do centrum na bezpiecznej wysokości ===
    G90
    G1 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} Z15 F15000

    { action_respond_info("QGL: Zakończone pomyślnie") }
    STATUS_READY

[gcode_macro CHECK_QGL]
description: Sprawdza wynik QGL na podstawie max_adjust
gcode:
    {% set qgl = printer.quad_gantry_level %}
    {% set max_adjust = printer.configfile.settings.quad_gantry_level.max_adjust | float %}

    {% set max_adjust_fail    = 0.180 %}
    {% set max_adjust_warning = 0.090 %}

    { action_respond_info("=== QGL CHECK ===") }
    { action_respond_info("max_adjust = %.4f mm" % max_adjust) }

    {% if not qgl.applied %}
        { action_respond_info("QGL CHECK: FAIL - korekta nie została zastosowana!") }
        SET_DISPLAY_TEXT MSG="QGL: FAIL ✗"
        M117 QGL FAILED!
        CANCEL_PRINT
        { action_raise_error("QGL nie powiódł się") }
    {% elif max_adjust > max_adjust_fail %}
        { action_respond_info("QGL CHECK: FAIL - zbyt duża korekta (%.4f mm)" % max_adjust) }
        SET_DISPLAY_TEXT MSG="QGL: FAIL ✗"
        M117 QGL TOO BIG!
        CANCEL_PRINT
        { action_raise_error("QGL: Za duża korekta gantry (%.4f mm) – sprawdź mechanikę!" % max_adjust) }
    {% elif max_adjust > max_adjust_warning %}
        { action_respond_info("QGL CHECK: WARNING - duża korekta (%.4f mm)" % max_adjust) }
        SET_DISPLAY_TEXT MSG="QGL: OK (duża korekta)"
        M117 QGL OK (large)
    {% else %}
        { action_respond_info("QGL CHECK: PASS ✓ (max_adjust = %.4f mm)" % max_adjust) }
        SET_DISPLAY_TEXT MSG="QGL: PASS ✓"
        M117 QGL OK!
        STATUS_READY
    {% endif %}

