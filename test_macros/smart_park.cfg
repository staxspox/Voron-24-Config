[gcode_macro SMART_PARK]
description: Parkuje głowicę blisko obszaru druku na czas dogrzewania hotendu
gcode:
    {% set z_height = 5.0 %}            ; możesz zmienić na inną wysokość (np. 5, 15)
    {% set park_margin = 5.0 %}         ; ile mm od krawędzi modelu (jak purge_margin)
    {% set verbose = True %}            ; True = pokazuje komunikat, False = cicho

    # --- fallback na środek stołu, jeśli nie ma danych o modelu ---
    {% set center_x = printer.toolhead.axis_maximum.x / 2 | float %}
    {% set center_y = printer.toolhead.axis_maximum.y / 2 | float %}
    {% set min_x = center_x %}
    {% set min_y = center_y %}

    # --- jeśli masz exclude_object włączone i slicer podał bounding box ---
    {% if printer.exclude_object.objects %}
        {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
        {% set min_x = all_points | map(attribute=0) | min | default(center_x) %}
        {% set min_y = all_points | map(attribute=1) | min | default(center_y) %}
        
        {% if park_margin > 0 %}
            {% set min_x = [min_x - park_margin, printer.toolhead.axis_minimum.x] | max %}
            {% set min_y = [min_y - park_margin, printer.toolhead.axis_minimum.y] | max %}
        {% endif %}
    {% endif %}

    # --- komunikat gdzie parkuje (opcjonalny) ---
    {% if verbose %}
        { action_respond_info("SMART_PARK → X: %.1f  Y: %.1f  Z: %.1f" % (min_x, min_y, z_height)) }
    {% endif %}

    # --- zapis stanu i ruch ---
    SAVE_GCODE_STATE NAME=SMART_PARK_STATE
    G90                         ; absolute positioning
    G0 Z{z_height} F6000        ; najpierw podnieś Z jeśli trzeba
    G0 X{min_x} Y{min_y} F{printer.toolhead.max_velocity * 60}  ; jedź blisko modelu
    G0 Z{z_height} F6000        ; upewnij się że Z jest na docelowej wysokości
    RESTORE_GCODE_STATE NAME=SMART_PARK_STATE